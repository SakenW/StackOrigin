<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运营大屏 · StackOrigin</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/uPlot.min.css">
  <link rel="stylesheet" href="/ops-preview.css">
  <script defer src="/motion-14.14.0.js"></script>
  <script defer src="/uPlot.iife.min.js"></script>
  <script type="module" src="/ops-preview.js"></script>
</head>
<body class="ops">
  <a class="skip" href="#main">跳到运营概览</a>
  <header class="ops-masthead">
    <div class="ops-width ops-topbar">
      <img src="/stackorion-brand.svg" width="155" height="24" alt="StackOrigin">
      <nav id="ops-navigation" class="ops-navigation" aria-label="工作台导航" hidden>
        <a href="/">工作台</a>
        <a href="/ops" aria-current="page">运营大屏</a>
      </nav>
      <span class="ops-mode" id="ops-mode"></span>
    </div>
  </header>
  <main class="ops-width ops-main" id="main" tabindex="-1">
    <div class="ops-heading">
      <h1 id="ops-title">运营大屏</h1>
      <button class="ops-replay" id="replay-monitoring" type="button" aria-controls="monitoring" hidden>回放监控演示</button>
    </div>
    <p id="preview-state" role="status">正在读取监控数据…</p>
    <div id="preview" hidden>
      <div class="ops-monitoring" id="monitoring">
        <section class="ops-monitor-group ops-server-group" aria-labelledby="heartbeat-title">
          <header class="ops-monitor-heading">
            <h2 id="heartbeat-title">服务器心跳</h2>
            <div class="ops-monitor-actions">
              <p class="ops-caption" id="host-monitor-count"></p>
              <button class="ops-replay" id="refresh-monitoring" type="button" hidden>刷新指标</button>
            </div>
          </header>
          <p class="ops-caption ops-monitor-note" id="live-host-status" role="status"></p>
          <div class="ops-host-grid" id="heartbeats"></div>
        </section>
        <section class="ops-monitor-group" id="domain-monitoring" aria-labelledby="domain-title">
          <header class="ops-monitor-heading">
            <h2 id="domain-title">域名与站点</h2>
            <div class="ops-monitor-actions">
              <p class="ops-caption" id="domain-monitor-count"></p>
              <button class="ops-replay" id="refresh-websites" type="button" hidden>刷新探测</button>
            </div>
          </header>
          <p class="ops-caption ops-monitor-note" id="live-website-status" role="status"></p>
          <div class="ops-domain-grid" id="domain-signals"></div>
        </section>
      </div>
      <p class="ops-demo-label" id="ops-demo-label" hidden>模拟巡检</p>
      <div class="ops-board">
        <section class="ops-card ops-queue" aria-labelledby="queue-title">
          <header class="ops-card-head">
            <h2 id="queue-title">待处理异常</h2>
            <div id="filters" class="ops-filters" role="group" aria-label="按优先级筛选">
              <button type="button" data-priority="all" aria-pressed="true">全部</button>
              <button type="button" data-priority="high" aria-pressed="false">高优先</button>
              <button type="button" data-priority="attention" aria-pressed="false">需跟进</button>
            </div>
          </header>
          <div class="ops-priority">
            <div class="ops-stacked-bar" id="priority-bar" aria-hidden="true"></div>
          </div>
          <p id="queue-count" class="sr-only" role="status"></p>
          <div id="queue"></div>
          <p id="queue-empty" class="ops-empty" hidden>当前筛选下没有待处理异常。</p>
        </section>

        <section class="ops-card ops-assets" aria-labelledby="asset-title">
          <header class="ops-card-head">
            <h2 id="asset-title">关联资产</h2>
            <span class="ops-caption" id="asset-count"></span>
          </header>
          <div class="ops-assets-body">
            <dl class="ops-impact-bars" id="impact-bars"></dl>
            <p class="ops-footnote" id="asset-note"></p>
          </div>
        </section>

        <section class="ops-card ops-inspection" aria-labelledby="inspection-title">
          <header class="ops-card-head">
            <h2 id="inspection-title">最近一次巡检</h2>
            <span class="ops-caption" id="coverage-label"></span>
          </header>
          <div class="ops-inspection-body">
            <time class="ops-clock" id="inspection-time"></time>
            <div class="ops-stacked-bar" id="coverage-bar" aria-hidden="true"></div>
            <dl class="ops-coverage" id="coverage"></dl>
            <details class="ops-panel-details ops-account-details">
              <summary>查看账号结果</summary>
              <p class="ops-footnote" id="disabled-accounts"></p>
              <ul id="accounts"></ul>
            </details>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
